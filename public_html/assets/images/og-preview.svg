<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#1c1c22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Caution Strip Top -->
  <rect x="0" y="0" width="1200" height="12" fill="url(#gold)"/>

  <!-- Badge -->
  <rect x="80" y="80" width="380" height="48" rx="24" fill="#FFCC00" fill-opacity="0.15" stroke="#FFCC00" stroke-width="2"/>
  <circle cx="106" cy="104" r="7" fill="#00E676"/>
  <text x="126" y="111" fill="#FFCC00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="2">BUILT FOR US CONTRACTORS</text>

  <!-- Headline -->
  <text x="80" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
    STOP LOSING $1,500+ JOBS
  </text>
  <text x="80" y="275" fill="#FFCC00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">
    TO MISSED PHONE CALLS.
  </text>

  <!-- Subheadline -->
  <text x="80" y="360" fill="#D1D5DB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="400">
    Instant automated 5-second SMS response when your hands are full on a job.
  </text>
  <text x="80" y="405" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Lock in homeowners before they call the next plumber, roofer, or HVAC tech on Google.
  </text>

  <!-- Mock Button -->
  <rect x="80" y="470" width="360" height="74" rx="16" fill="url(#gold)"/>
  <text x="140" y="518" fill="#121212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" letter-spacing="1">
    REQUEST A CALL NOW
  </text>

  <!-- Brand Signature -->
  <text x="880" y="520" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="1">
    POWERED BY GREEN RIVER
  </text>
</svg>
